name: Android Debug APK

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Write local.properties
        run: |
          {
            echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}"
            echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}"
            echo "LISTEN_TOGETHER_SERVER=${{ secrets.LISTEN_TOGETHER_SERVER }}"
          } > local.properties

      # Restore the debug keystore when the secret is configured, so the
      # APK installs over a local debug build; otherwise AGP signs the
      # debug APK with a throwaway key.
      - name: Restore debug keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            mkdir -p ~/.android
            echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore
          fi

      # google-services.json carries an API key, so it lives in a Secret,
      # not in the public repo. Without it the google-services plugin
      # fails the build — set the secret before the first FCM build.
      - name: Write google-services.json
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > app/google-services.json
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build prod debug APK
        run: ./gradlew :app:assembleProdDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: bitchord-prod-debug-apk
          path: app/build/outputs/apk/prod/debug/*.apk
          if-no-files-found: error
          retention-days: 14
